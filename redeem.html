<!DOCTYPE html>
<html lang="tr">
<head>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

<body>
    <header>
        <div id="main-menu">
            <h1 id="main-logo"><span style="color: skyblue;">boy</span>or<span style="color: pink;">girl</span>.party</h1>
            <div id="menu-icon">
                <div class="btn-menu"></div>
                <div class="btn-menu"></div>
                <div class="btn-menu"></div>
            </div>
        </div>
        <div id="expanded-menu" style="display: none;">
                <span class="material-symbols-outlined" style="font-size:43px; color:white;">event_upcoming</span>
                <span class="material-symbols-outlined" style="font-size:43px; color:white;">redeem</span>
                <span class="material-symbols-outlined" style="font-size:43px; color:white;">shopping_cart</span>

    </header>
    <div class="container">
        <h2>Ürününü kullan</h2>
        <label for="text" class="text-label">E-posta ile iletilen ürün kodunu ilgili alana gir:</label>
        <input type="text" id="text" name="text" placeholder="XXXXXXXX" maxlength="8">

    <script src="redeem.js"></script>
